<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>KÖLN RASTET AUS — Rievkooche Game</title>
<style>
:root{--w:941;--h:1672}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090909;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:18px;overflow:auto}
#stage{position:relative;width:min(92vw,560px);aspect-ratio:941/1672;max-height:96vh;overflow:hidden;background:#b7b4b0;border-radius:12px;box-shadow:0 28px 90px rgba(0,0,0,.55);touch-action:none}
#poster{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center center;z-index:0;user-select:none;-webkit-user-drag:none}
#shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,0) 24%,rgba(0,0,0,.03) 62%,rgba(0,0,0,.22))}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
#hud{position:absolute;left:12px;right:12px;top:12px;z-index:7;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:9px;font-weight:900;letter-spacing:.22em;color:#fff;text-shadow:0 2px 8px #000}
.pills{display:flex;gap:6px}
.pill{min-width:56px;padding:6px 8px;border:1px solid rgba(255,255,255,.38);border-radius:9px;background:rgba(0,0,0,.48);backdrop-filter:blur(7px);color:#fff;text-align:center;font-size:8px;letter-spacing:.12em;text-shadow:0 1px 4px #000}
.pill b{display:block;font-size:15px;letter-spacing:0;margin-top:1px}
#bottom{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#combo{color:#fff;font-size:9px;font-weight:900;letter-spacing:.16em;text-shadow:0 2px 7px #000}
#sound{pointer-events:auto;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:8px;font-weight:700;cursor:pointer}
#modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
.card{width:min(90%,390px);padding:26px 22px;border:1px solid rgba(255,255,255,.32);border-radius:18px;background:rgba(10,10,10,.78);box-shadow:0 24px 70px rgba(0,0,0,.45);color:#fff;text-align:center}
.kicker{font-size:8px;font-weight:900;letter-spacing:.3em;opacity:.65}
h1{margin:10px 0 12px;font-size:clamp(28px,7vw,50px);line-height:.88;letter-spacing:-.055em}
.copy{font-size:13px;line-height:1.38;opacity:.98;font-weight:900;letter-spacing:.01em;text-shadow:0 1px 5px rgba(0,0,0,.35)}
#start{margin-top:18px;border:0;border-radius:999px;padding:13px 22px;background:#fff;color:#111;font-size:10px;font-weight:900;letter-spacing:.12em;cursor:pointer}
.tip{margin-top:10px;font-size:9px;opacity:.48}
.flash{position:absolute;inset:0;z-index:15;background:#fff;opacity:0;pointer-events:none}
@media(max-width:600px){body{padding:0}#stage{width:100vw;max-height:none;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>
(()=>{
"use strict";
const stage=document.getElementById('stage'),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const modal=document.getElementById('modal'),start=document.getElementById('start'),soundBtn=document.getElementById('sound');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),title=document.getElementById('title'),copy=document.getElementById('copy'),flash=document.getElementById('flash');
let W=0,H=0,dpr=1,running=false,score=0,time=30,combo=0,x=.5,items=[],sparks=[],last=0,spawn=0,timer=0,raf=0,sound=true,audio=null;

function resize(){
  const r=stage.getBoundingClientRect(); W=r.width; H=r.height; dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

function audioInit(){
  if(!sound)return;
  if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=new A()}
  if(audio.state==='suspended')audio.resume();
}
function applesauceFanfare(){
  if(!sound)return;
  audioInit(); if(!audio)return;
  const now=audio.currentTime;
  [[523.25,0,.10],[659.25,.08,.10],[783.99,.16,.16]].forEach(([f,t,d])=>{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f,now+t);
    g.gain.setValueAtTime(.0001,now+t);
    g.gain.exponentialRampToValueAtTime(.065,now+t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+t+d);
    o.connect(g);g.connect(audio.destination);o.start(now+t);o.stop(now+t+d+.02);
  });
}
function beep(f,d=.08,type='sine',v=.035){
  if(!sound)return; audioInit(); if(!audio)return;
  const o=audio.createOscillator(),g=audio.createGain(); o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d);
}
function hud(){scoreEl.textContent=String(score).padStart(4,'0');timeEl.textContent=time;comboEl.textContent=combo>1?`COMBO ×${combo}`:'READY'}
let musicTimer=null, musicStep=0;
const alaafNotes=[261.63,329.63,392.00,523.25,392.00,329.63,293.66,392.00];
function carnivalNote(freq,when,dur=.18){
  if(!sound||!audio)return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type='square'; o.frequency.setValueAtTime(freq,when);
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.045,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+dur+.02);
}
function startAlaafMusic(){
  audioInit(); if(!audio)return;
  clearInterval(musicTimer); musicStep=0;
  const playBar=()=>{
    if(!sound||!audio)return;
    const now=audio.currentTime+.03;
    for(let i=0;i<8;i++) carnivalNote(alaafNotes[(musicStep+i)%alaafNotes.length],now+i*.16,.13);
    // simple brass-like accent
    carnivalNote(130.81,now,.38); carnivalNote(196,now+.48,.28);
    musicStep=(musicStep+8)%alaafNotes.length;
  };
  playBar(); musicTimer=setInterval(playBar,1280);
}
function stopAlaafMusic(){clearInterval(musicTimer);musicTimer=null}

function setX(v){x=Math.max(.08,Math.min(.92,v))}
canvas.addEventListener('pointermove',e=>{if(!running)return;const r=canvas.getBoundingClientRect();setX((e.clientX-r.left)/r.width)});
canvas.addEventListener('pointerdown',e=>{if(!running)return;const r=canvas.getBoundingClientRect();setX((e.clientX-r.left)/r.width)});
document.addEventListener('keydown',e=>{if(!running)return; if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setX(x-.065); if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setX(x+.065)});

function addItem(){
  const applesauce=Math.random()<.14;
  items.push({x:.08+Math.random()*.84,y:-40,speed:90+Math.random()*100,size:applesauce?24:22,applesauce,rot:Math.random()*6.28,rv:(Math.random()-.5)*4});
}
function sparkBurst(px,py,special){
  for(let i=0;i<(special?32:16);i++) sparks.push({x:px,y:py,vx:(Math.random()-.5)*(special?240:180),vy:(Math.random()-.8)*(special?240:180),life:1,r:1.5+Math.random()*3});
}
function shortFanfare(){
  if(!sound)return;
  audioInit(); if(!audio)return;
  const now=audio.currentTime+.01;
  [523.25,659.25,783.99,1046.5].forEach((f,k)=>carnivalNote(f,now+k*.065,.12));
  carnivalNote(261.63,now,.28);
}
function hit(i){
  const o=items[i]; if(!o)return;
  const px=x*W,ox=o.x*W;
  if(o.y>H-150 && Math.abs(px-ox)<76){
    score+=o.applesauce?100:10+Math.min(combo,12)*2; combo++;
    sparkBurst(ox,o.y,o.applesauce); domPulse=.65;
    beep(o.applesauce?880:440,o.applesauce?.13:.07,o.applesauce?'triangle':'square',o.applesauce?.07:.045);
    if(o.applesauce){flash.style.opacity='.16';setTimeout(()=>flash.style.opacity='0',70);shortFanfare()}
    items.splice(i,1); hud();
  }
}
function drawRiev(o){
  const px=o.x*W,py=o.y,s=o.size; ctx.save();ctx.translate(px,py);ctx.rotate(o.rot);
  if(o.applesauce){
    // kleiner, klar erkennbarer Klecks Apfelmus
    const g=ctx.createRadialGradient(-4,-5,1,0,0,s);
    g.addColorStop(0,'#ffd98a');g.addColorStop(.52,'#d98a32');g.addColorStop(1,'#8f4215');
    ctx.fillStyle=g;ctx.beginPath();
    ctx.moveTo(-18,2);ctx.bezierCurveTo(-15,-9,-8,-14,0,-11);ctx.bezierCurveTo(7,-18,18,-10,17,-2);
    ctx.bezierCurveTo(21,7,10,13,4,10);ctx.bezierCurveTo(-2,17,-13,13,-14,7);ctx.bezierCurveTo(-20,7,-21,3,-18,2);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,244,190,.55)';ctx.beginPath();ctx.ellipse(-5,-6,6,3,0,0,6.283);ctx.fill();
    ctx.fillStyle='#fff3c4';ctx.font='900 7px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('APFEL',0,2);
  }else{
    const g=ctx.createRadialGradient(-5,-5,2,0,0,s);
    g.addColorStop(0,'#ffd77a');g.addColorStop(.55,'#e27c1e');g.addColorStop(1,'#8e3209');
    ctx.fillStyle=g;ctx.beginPath();
    const n=15;for(let k=0;k<n;k++){const a=k*6.283/n,rr=s*(.72+.16*Math.sin(k*3.1)+Math.random()*.08),xx=Math.cos(a)*rr,yy=Math.sin(a)*rr;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(70,25,4,.24)';for(let k=0;k<9;k++){ctx.beginPath();ctx.arc((Math.random()-.5)*s*1.25,(Math.random()-.5)*s*1.25,1.2,0,6.283);ctx.fill()}
  }
  ctx.restore();
}
let domPulse=0;
function drawDom(dt){
  const img=document.getElementById('domReference');
  if(!img || !img.complete || !img.naturalWidth)return;
  const px=x*W, base=H-28;
  domPulse=Math.max(0,domPulse-dt*3.5);

  const maxW=Math.min(W*.48,215);
  const scale=maxW/img.naturalWidth;
  const dw=img.naturalWidth*scale*(1+domPulse*.025);
  const dh=img.naturalHeight*scale*(1+domPulse*.025);

  ctx.save();
  ctx.translate(px,base);
  ctx.globalAlpha=.98;
  ctx.shadowColor='rgba(0,0,0,.38)';
  ctx.shadowBlur=12;
  ctx.shadowOffsetY=6;
  ctx.drawImage(img,-dw/2,-dh,dw,dh);
  ctx.restore();
}
function drawSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=330*dt;p.life-=dt*1.9;if(p.life<=0){sparks.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle='#f0a33b';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.globalAlpha=1}
}
function loop(ts){
  if(!running)return;let dt=Math.min(.04,(ts-last)/1000||0);last=ts;spawn+=dt;
  if(spawn>.42){addItem();spawn=0}
  for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.speed*dt;o.rot+=o.rv*dt;hit(i);if(i<items.length&&items[i]===o&&o.y>H+50){items.splice(i,1);combo=0;hud()}}
  ctx.clearRect(0,0,W,H);items.forEach(drawRiev);drawDom(dt);drawSparks(dt);raf=requestAnimationFrame(loop);
}
function startGame(){
  copy.innerHTML='<strong>FANG DE RIEVKOOCHE!</strong><br><strong>UNN WENN DE APFELMUS KÜTT:</strong><br><strong>ZACK – FANFARE!</strong><br><strong>30 SEKUNDE. KEIN GESCHWÄTZ.</strong><br><strong>KÖLLE ALAAF!</strong>';

  audioInit();startAlaafMusic();score=0;time=30;combo=0;items=[];sparks=[];running=true;hud();modal.style.display='none';
  clearInterval(timer);timer=setInterval(()=>{time--;hud();if(time<=0)endGame()},1000);
  last=performance.now();spawn=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  beep(440,.07,'square',.045);setTimeout(()=>beep(660,.07,'square',.045),90);setTimeout(()=>beep(880,.11,'square',.05),180);
}
function endGame(){
  running=false;cancelAnimationFrame(raf);clearInterval(timer);stopAlaafMusic();items=[];sparks=[];
  let h='NOCHMAL?',m='Der Apfelmus war stärker.';
  if(score>=700){h='KÖLN RASTET AUS';m='Jürgen darf das Shirt tragen.'}
  else if(score>=350){h='ORDENTLICH';m='Aber da geht noch mehr.'}
  title.innerHTML=`${score} PUNKTE<br><span style="font-size:.55em">${h}</span>`;copy.innerHTML='<strong>FANG DE RIEVKOOCHE!</strong><br><strong>UNN WENN DE APFELMUS KÜTT:</strong><br><strong>ZACK – KÜTT DIE FANFARE!</strong><br><strong>30 SEKUNDE – KEIN JEFASSEL!</strong><br><strong>KÖLLE ALAAF!</strong>';start.textContent='PLAY AGAIN';modal.style.display='grid';
  beep(220,.18,'sawtooth',.05);setTimeout(()=>beep(165,.22,'sawtooth',.045),120);
}
soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF';if(sound){audioInit();startAlaafMusic();beep(520,.08)}else stopAlaafMusic()});
start.addEventListener('click',startGame);hud();
})();
</script>
